<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800">
  <!-- PLACEHOLDER FRAME. Replace with your own 600x1800 artwork.
       Photo windows sit at x=30, w=540, h=405, y = 30 / 453 / 876 / 1299.
       Everything here is drawn ON TOP of the photos. -->

  <!-- Colour bars filling the gaps between windows -->
  <rect x="30" y="435"  width="540" height="18" fill="#D6C539"/>
  <rect x="30" y="858"  width="540" height="18" fill="#DF5643"/>
  <rect x="30" y="1281" width="540" height="18" fill="#8D6BAB"/>

  <!-- Hairline around each photo window -->
  <g fill="none" stroke="#000000" stroke-width="4">
    <rect x="32" y="32"   width="536" height="401"/>
    <rect x="32" y="455"  width="536" height="401"/>
    <rect x="32" y="878"  width="536" height="401"/>
    <rect x="32" y="1301" width="536" height="401"/>
  </g>

  <!-- Footer plate: y 1704 -> 1800 -->
  <rect x="0" y="1704" width="600" height="96" fill="#D575B5"/>
  <rect x="0" y="1704" width="600" height="96" fill="none" stroke="#000000" stroke-width="6"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="1748" font-size="30" font-weight="600" letter-spacing="3" fill="#000000">MIAMI PHOTOBOOTH</text>
    <text x="300" y="1776" font-size="15" font-weight="500" letter-spacing="4" fill="#000000">305 / ALL LOVE</text>
  </g>

  <!-- Outer trim -->
  <rect x="3" y="3" width="594" height="1794" fill="none" stroke="#000000" stroke-width="6"/>
</svg>
